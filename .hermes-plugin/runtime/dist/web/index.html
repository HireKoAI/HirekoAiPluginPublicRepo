<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hireko — MCP Console</title>
    <link rel="icon" href="/human/mark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #eceee9;
        --dot: #d7dbd3;
        --glass: rgba(255, 255, 255, 0.55);
        --white: #ffffff;
        --ink: #1a221c;
        --muted: #7a867e;
        --line: #e4e8e2;
        --green: #7ac24f;
        --green-2: #5aa83a;
        --green-soft: #e9f6df;
        --danger: #c63b3b;
        --font: "Sora", "Avenir Next", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
        --r: 1.1rem;
        --r-sm: 0.65rem;
        --shadow: 0 0.75rem 2rem rgba(26, 34, 28, 0.07);
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        font: 400 0.9rem/1.45 var(--font);
        color: var(--ink);
        background-color: var(--bg);
        background-image: radial-gradient(var(--dot) 0.07rem, transparent 0.07rem);
        background-size: 0.95rem 0.95rem;
        -webkit-font-smoothing: antialiased;
      }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      a { color: var(--green-2); text-decoration: none; }

      .shell {
        display: grid;
        grid-template-columns: 15.5rem minmax(0, 1fr);
        gap: 1rem;
        max-width: 68rem;
        margin: 0 auto;
        padding: 1.25rem;
        min-height: 100vh;
      }
      @media (max-width: 52rem) {
        .shell { grid-template-columns: 1fr; }
        .sidebar { position: static; max-height: none; }
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.1rem;
        border-radius: var(--r);
        background: var(--glass);
        backdrop-filter: blur(1.5rem) saturate(1.2);
        -webkit-backdrop-filter: blur(1.5rem) saturate(1.2);
        border: 0.0625rem solid rgba(255,255,255,0.75);
        box-shadow: var(--shadow);
        position: sticky;
        top: 1.25rem;
        align-self: start;
        min-height: calc(100vh - 2.5rem);
      }

      .brand { display: block; color: inherit; }
      .brand img {
        display: block;
        width: 100%;
        max-width: 11.5rem;
        height: auto;
      }
      .brand-sub {
        margin: 0.35rem 0 0;
        font-size: 0.7rem;
        color: var(--muted);
        font-weight: 500;
      }

      .node {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.55rem 0.75rem;
        border-radius: 0.7rem;
        border: 0.0625rem solid var(--line);
        background: var(--white);
        font-size: 0.8rem;
        font-weight: 500;
      }
      .node-dot {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 0.2rem var(--green-soft);
        flex-shrink: 0;
      }

      .nav { display: flex; flex-direction: column; gap: 0.2rem; flex: 1; }
      .nav button {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        width: 100%;
        padding: 0.6rem 0.7rem;
        border: 0;
        border-radius: 0.65rem;
        background: transparent;
        color: var(--muted);
        font-weight: 500;
        font-size: 0.86rem;
        text-align: left;
      }
      .nav button:hover { background: rgba(255,255,255,0.6); color: var(--ink); }
      .nav button.active {
        background: var(--green-soft);
        color: var(--green-2);
      }
      .nav svg { width: 1.05rem; height: 1.05rem; opacity: 0.9; }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        border: 0;
        border-radius: 0.7rem;
        padding: 0.65rem 0.95rem;
        font-weight: 600;
        font-size: 0.86rem;
      }
      .btn svg { width: 1rem; height: 1rem; }
      .btn-green {
        background: var(--green);
        color: #fff;
      }
      .btn-green:hover { background: var(--green-2); }
      .btn-block { width: 100%; }
      .sidebar-foot { padding-top: 0.5rem; }

      .panel {
        border-radius: var(--r);
        background: var(--white);
        box-shadow: var(--shadow);
        border: 0.0625rem solid rgba(255,255,255,0.95);
        padding: 1.5rem 1.6rem 1.75rem;
      }
      .panel h1 {
        margin: 0 0 0.3rem;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }
      .lede { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.86rem; max-width: 36rem; }

      .err {
        margin: 0 0 1rem;
        padding: 0.65rem 0.85rem;
        border-radius: var(--r-sm);
        background: #fdecec;
        color: var(--danger);
        white-space: pre-wrap;
        font-size: 0.85rem;
      }
      .muted { color: var(--muted); }
      .loading { padding: 3rem; text-align: center; color: var(--muted); }

      .server-list { display: flex; flex-direction: column; gap: 0.65rem; margin-bottom: 1.25rem; }
      .server-card {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 0.85rem;
        align-items: center;
        padding: 0.85rem 0.95rem;
        border-radius: 0.85rem;
        border: 0.0625rem solid var(--line);
        background: #fafbfa;
      }
      .server-ico {
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 0.6rem;
        background: var(--green-soft);
        color: var(--green-2);
        display: grid;
        place-items: center;
      }
      .server-ico svg { width: 1.1rem; height: 1.1rem; }
      .server-id { font-weight: 650; font-size: 0.95rem; letter-spacing: -0.01em; }
      .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.3rem 0; }
      .tag {
        padding: 0.12rem 0.5rem;
        border-radius: 0.4rem;
        background: var(--green-soft);
        color: var(--green-2);
        font-size: 0.68rem;
        font-weight: 600;
      }
      .tag.dim { background: #eef1ed; color: var(--muted); }
      .server-url {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .server-desc {
        margin-top: 0.25rem;
        font-size: 0.78rem;
        line-height: 1.35;
      }
      .actions { display: flex; gap: 0.3rem; }
      .icon-btn {
        width: 2rem;
        height: 2rem;
        border-radius: 0.55rem;
        border: 0.0625rem solid var(--line);
        background: var(--white);
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover { color: var(--ink); border-color: #cfd6cb; }
      .icon-btn.accent { background: var(--green); border-color: transparent; color: #fff; }
      .icon-btn svg { width: 0.95rem; height: 0.95rem; }

      .add-box {
        padding: 1.1rem 1.15rem 1.2rem;
        border-radius: 0.9rem;
        border: 0.08rem dashed #b7d9a0;
        background: #f7fbf4;
      }
      .add-box h2 { margin: 0 0 0.9rem; font-size: 0.95rem; font-weight: 650; }
      .grid-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem 0.85rem;
      }
      @media (max-width: 40rem) { .grid-form { grid-template-columns: 1fr; } }
      .field { display: flex; flex-direction: column; gap: 0.3rem; }
      .field.wide { grid-column: 1 / -1; }
      .field label { font-size: 0.72rem; font-weight: 600; color: var(--muted); }
      .field input, .field select {
        width: 100%;
        padding: 0.55rem 0.7rem;
        border-radius: 0.55rem;
        border: 0.0625rem solid var(--line);
        background: var(--white);
      }
      .field input:focus, .field select:focus {
        outline: none;
        border-color: #a8d48a;
        box-shadow: 0 0 0 0.15rem var(--green-soft);
      }
      .add-box .btn { margin-top: 0.9rem; width: 100%; }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
        gap: 0.65rem;
        margin-bottom: 1.1rem;
      }
      .stat {
        padding: 0.85rem 0.95rem;
        border-radius: 0.75rem;
        border: 0.0625rem solid var(--line);
        background: #fafbfa;
      }
      .stat b { display: block; font-size: 1.25rem; letter-spacing: -0.02em; }
      .stat span { color: var(--muted); font-size: 0.75rem; }

      .docs p { color: var(--muted); max-width: 36rem; font-size: 0.9rem; }
      .docs code {
        font-family: var(--mono);
        font-size: 0.82em;
        background: var(--green-soft);
        padding: 0.08rem 0.3rem;
        border-radius: 0.25rem;
        color: var(--green-2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/human/app.js"></script>
  </body>
</html>
